[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-history-recovery"
version = "0.1.0"
description = "Causal-History Dependence in Robot Policy Recovery: A Matched-State Evaluation under Execution-Induced Failures"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Causal History Recovery Research Team"}
]
keywords = [
    "robotics",
    "policy recovery",
    "causal inference",
    "counterfactual evaluation",
    "reinforcement learning",
    "imitation learning",
    "manipulation"
]
dependencies = [
    "mujoco>=3.1.0",
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "torch>=2.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pydantic>=2.0.0",
    "h5py>=3.8.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "black>=23.3.0",
    "ruff>=0.0.270"
]

[tool.setuptools.packages.find]
where = ["src"]

