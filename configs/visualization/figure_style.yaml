# Publication Figure Style Configuration (Science / IEEE Transactions standard)

style:
  font_family: "sans-serif"
  font_sans_serif: ["DejaVu Sans", "Helvetica", "Arial"]
  font_size: 10
  axes_labelsize: 10
  axes_titlesize: 11
  xtick_labelsize: 9
  ytick_labelsize: 9
  legend_fontsize: 8.5
  figure_titlesize: 12
  lines_linewidth: 1.75
  lines_markersize: 5

figure_sizes:
  single_col: [3.5, 2.6]
  half_page: [5.0, 3.2]
  double_col: [7.0, 3.2]
  wide: [8.0, 4.0]

dpi:
  screen: 150
  publication_png: 600

formats:
  - "png"
  - "pdf"

colors:
  primary: "#1f77b4"       # Deep blue
  secondary: "#ff7f0e"     # Safety orange
  success: "#2ca02c"       # Forest green
  deviation: "#d62728"     # Crimson red
  oracle: "#9467bd"        # Royal purple
  condition_b0: "#1f77b4"  # Blue (Full history)
  condition_b2: "#e377c2"  # Pink (Obs-ablated)
  condition_b4: "#7f7f7f"  # Gray (Fully-ablated)
  neutral_dark: "#333333"
  neutral_light: "#f5f5f5"

grid:
  visible: true
  alpha: 0.3
  linestyle: "--"

