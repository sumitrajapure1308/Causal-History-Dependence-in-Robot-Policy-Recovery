task_name: "planned_custom_push_target_env"
task_type: "contact_rich_pushing"
simulator: "mujoco"
model_file: "src/causal_history_recovery/environments/assets/push_target.xml"
timestep: 0.005
episode_horizon: 150
control_frequency_hz: 200

workspace_bounds:
  x: [-0.45, 0.45]
  y: [-0.45, 0.45]
  z: [0.0, 0.25]

target_zone:
  center: [0.25, 0.0, 0.025]
  radius: 0.06
  min_dwell_steps: 5
  max_yaw_tolerance_rad: 0.35

object:
  type: "box"
  half_extents: [0.025, 0.025, 0.025]
  mass: 0.10
  friction: [0.4, 0.005, 0.0001]

deviation_thresholds:
  slip_angle_threshold_deg: 15.0
  slip_angle_threshold_rad: 0.2618
  lateral_drift_threshold_m: 0.020
  min_contact_force_n: 0.05
